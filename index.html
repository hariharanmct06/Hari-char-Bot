<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07090f">
  
  <title>HARI BOT — Your Personal AI Portfolio Companion</title>
  <meta name="description" content="Meet HARI BOT, the interactive AI companion for Hariharan. Learn about his mechatronics projects, energy healing gifts, chess achievements, and more.">

  <!-- External Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07090f;
      --bg2: #0d1117;
      --bg3: #131820;
      --surface: rgba(18, 24, 36, 0.95);
      --teal: #00e5cc;
      --teal2: #00b8a4;
      --gold: #f5a623;
      --gold2: #e8931a;
      --glow-t: 0 0 20px rgba(0, 229, 204, 0.45), 0 0 60px rgba(0, 229, 204, 0.15);
      --glow-g: 0 0 20px rgba(245, 166, 35, 0.5), 0 0 60px rgba(245, 166, 35, 0.2);
      --text: #e8f0f5;
      --muted: #5a7a8a;
      --border: rgba(0, 229, 204, 0.12);
      --border-g: rgba(245, 166, 35, 0.2);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
    }

    body {
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      position: fixed; /* Lock body position on mobile to prevent bounce scrolling */
      width: 100%;
      inset: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: none; /* Let specific divs manage scroll */
    }

    /* Animated background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Radial glow blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.07;
      pointer-events: none;
      z-index: 0;
      animation: blobFloat 8s ease-in-out infinite;
    }
    .blob1 { width: 500px; height: 500px; background: var(--teal); top: -100px; left: -100px; animation-delay: 0s; }
    .blob2 { width: 400px; height: 400px; background: var(--gold); bottom: -80px; right: -80px; animation-delay: 3s; }
    .blob3 { width: 300px; height: 300px; background: var(--teal); bottom: 20%; left: 30%; animation-delay: 5s; }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -20px) scale(1.05); }
    }

    /* Grid overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0, 229, 204, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 204, 0.025) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* ===== MAIN CHAT CONTAINER ===== */
    #app {
      position: relative;
      z-index: 10;
      width: min(780px, 100vw);
      height: 100vh;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, rgba(13, 17, 23, 0.97), rgba(7, 9, 15, 0.98));
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
    }

    @media (min-width: 600px) {
      #app {
        width: min(780px, 95vw);
        height: min(85vh, 800px);
        border-radius: 24px;
        border: 1px solid rgba(0, 229, 204, 0.18);
        box-shadow:
          0 0 0 1px rgba(0, 229, 204, 0.06),
          0 40px 100px rgba(0, 0, 0, 0.7),
          0 0 80px rgba(0, 229, 204, 0.07);
      }
    }

    /* Mobile absolute viewport override via JS */
    @media (max-width: 599px) {
      #app {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }
    }

    /* ===== HEADER ===== */
    header {
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: linear-gradient(135deg, rgba(13, 17, 23, 0.98), rgba(18, 24, 36, 0.95));
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    @media (min-width: 600px) {
      header { padding: 18px 24px; }
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--teal), var(--gold), transparent);
      opacity: 0.4;
    }

    .bot-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--teal), var(--gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: var(--glow-t);
      animation: avatarPulse 3s ease-in-out infinite;
      position: relative;
    }
    @media (min-width: 600px) {
      .bot-avatar { width: 48px; height: 48px; font-size: 22px; }
    }
    .bot-avatar::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: linear-gradient(var(--bg2), var(--bg2)) padding-box,
                  linear-gradient(135deg, var(--teal), var(--gold)) border-box;
      animation: spin 6s linear infinite;
    }
    @keyframes avatarPulse {
      0%, 100% { box-shadow: var(--glow-t); }
      50% { box-shadow: 0 0 30px rgba(245, 166, 35, 0.5), 0 0 80px rgba(245, 166, 35, 0.15); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .header-info { flex: 1; min-width: 0; }
    h1.bot-name {
      font-family: 'Orbitron', monospace;
      font-size: clamp(14px, 4.5vw, 18px);
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--teal), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bot-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 6px var(--teal);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .header-tags {
      display: none;
      gap: 6px;
      align-items: center;
    }
    @media (min-width: 480px) { .header-tags { display: flex; } }
    .htag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 1px;
      padding: 3px 9px;
      border-radius: 100px;
      border: 1px solid var(--border-g);
      color: var(--gold);
      background: rgba(245, 166, 35, 0.05);
    }

    #settings-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      transition: color 0.2s ease;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      outline: none;
      user-select: none;
    }
    #settings-btn:hover {
      color: var(--teal);
    }

    /* ===== MESSAGES CONTAINER ===== */
    #messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* Momentum scrolling for iOS */
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 229, 204, 0.15) transparent;
      overscroll-behavior: contain; /* Prevent body scrolling on boundary reach */
      touch-action: pan-y;
    }
    @media (min-width: 600px) {
      #messages { padding: 24px 28px; }
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(0, 229, 204, 0.15); border-radius: 4px; }

    .msg {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: msgIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .msg.user { flex-direction: row-reverse; }

    .msg-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      user-select: none;
    }
    .msg.bot .msg-icon { background: rgba(0, 229, 204, 0.1); border: 1px solid rgba(0, 229, 204, 0.2); }
    .msg.user .msg-icon { background: rgba(245, 166, 35, 0.1); border: 1px solid rgba(245, 166, 35, 0.2); }

    .bubble {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 18px;
      font-size: clamp(13px, 3.8vw, 14.5px);
      line-height: 1.65;
      position: relative;
      word-break: break-word;
    }
    @media (min-width: 600px) {
      .bubble { max-width: 75%; font-size: 14.5px; padding: 12px 16px; }
    }
    .msg.bot .bubble {
      background: rgba(0, 229, 204, 0.07);
      border: 1px solid rgba(0, 229, 204, 0.14);
      color: var(--text);
      border-bottom-left-radius: 5px;
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, rgba(245, 166, 35, 0.18), rgba(232, 147, 26, 0.12));
      border: 1px solid rgba(245, 166, 35, 0.25);
      color: var(--text);
      border-bottom-right-radius: 5px;
    }

    /* Shouting bubble visual shake & red glow */
    @keyframes shoutGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 68, 68, 0.45); border-color: rgba(255, 68, 68, 0.45); }
      50% { box-shadow: 0 0 25px rgba(255, 68, 68, 0.85); border-color: rgba(255, 68, 68, 0.85); }
    }
    @keyframes shoutShake {
      0%, 100% { transform: scale(1) rotate(0deg); }
      15%, 45%, 75% { transform: scale(1.03) rotate(-2deg); }
      30%, 60%, 90% { transform: scale(1.03) rotate(2deg); }
    }
    .msg.bot .bubble.shout-bubble {
      animation: shoutShake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both, shoutGlow 1.5s infinite alternate;
      border: 1px solid rgba(255, 68, 68, 0.5) !important;
      background: rgba(255, 68, 68, 0.09) !important;
      color: #ff5555 !important;
      font-weight: 900 !important;
      font-size: clamp(14.5px, 4.2vw, 17px) !important;
      letter-spacing: 0.5px;
    }

    /* Typing indicator */
    .typing-bubble {
      background: rgba(0, 229, 204, 0.07);
      border: 1px solid rgba(0, 229, 204, 0.14);
      border-radius: 18px;
      border-bottom-left-radius: 5px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .tdot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      animation: tdot 1.3s ease-in-out infinite;
    }
    .tdot:nth-child(2) { animation-delay: .18s; }
    .tdot:nth-child(3) { animation-delay: .36s; }
    @keyframes tdot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* ===== SUGGESTIONS CHIPS ===== */
    #suggestions {
      padding: 0 14px 10px;
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-x;
    }
    #suggestions::-webkit-scrollbar { display: none; }
    @media (min-width: 600px) {
      #suggestions { padding: 0 28px 12px; flex-wrap: wrap; overflow-x: visible; }
    }
    
    .sugg {
      padding: 7px 13px;
      border-radius: 100px;
      cursor: pointer;
      border: 1px solid rgba(0, 229, 204, 0.18);
      color: var(--muted);
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
      background: rgba(0, 229, 204, 0.04);
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      min-height: 34px;
      user-select: none;
      outline: none;
    }
    .sugg:active, .sugg:hover {
      border-color: var(--teal);
      color: var(--teal);
      background: rgba(0, 229, 204, 0.08);
    }

    /* ===== INPUT CONTAINER ===== */
    #input-area {
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
      background: rgba(7, 9, 15, 0.5);
    }
    @media (min-width: 600px) {
      #input-area { padding: 16px 24px 20px; gap: 10px; }
    }

    #chat-form {
      display: flex;
      width: 100%;
      gap: 8px;
      align-items: center;
    }

    #chat-input {
      flex: 1;
      background: rgba(0, 229, 204, 0.04);
      border: 1px solid rgba(0, 229, 204, 0.15);
      border-radius: 14px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 16px; /* 16px prevents iOS zoom-on-focus */
      font-family: 'DM Sans', sans-serif;
      outline: none;
      resize: none;
      height: 46px;
      transition: border-color 0.2s ease;
      -webkit-appearance: none;
      touch-action: manipulation;
    }
    #chat-input:focus { border-color: rgba(0, 229, 204, 0.4); }
    #chat-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 13px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--teal), var(--teal2));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      color: #000;
      font-weight: bold;
      transition: all 0.2s ease;
      box-shadow: 0 0 14px rgba(0, 229, 204, 0.3);
      touch-action: manipulation;
      user-select: none;
    }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    footer.powered {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: rgba(90, 122, 138, 0.4);
      padding: 0 0 8px;
      letter-spacing: 1px;
      flex-shrink: 0;
      user-select: none;
      background: rgba(7, 9, 15, 0.5);
    }

    /* ===== EGG SPLATTER OVERLAY & ANIMATION ===== */
    #egg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      pointer-events: none;
      overflow: hidden;
    }
    .egg-el {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      font-size: 36px;
      transform-origin: center center;
      user-select: none;
    }
    #nope-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100000;
      pointer-events: none;
      font-family: 'Orbitron', monospace;
      font-size: clamp(16px, 4.5vw, 26px);
      font-weight: 900;
      color: #ff4444;
      text-align: center;
      text-shadow: 0 0 30px rgba(255, 68, 68, 0.8);
      white-space: nowrap;
      animation: nopePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      user-select: none;
    }
    @keyframes nopePop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes splatAnim {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.3) rotate(15deg); opacity: 1; }
      100% { transform: scale(1) rotate(10deg); opacity: 0; }
    }

    /* ===== SETTINGS MODAL ===== */
    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(7, 9, 15, 0.85);
      z-index: 20000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .settings-card {
      background: linear-gradient(135deg, rgba(13, 17, 23, 0.98), rgba(18, 24, 36, 0.98));
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 20px;
      width: min(420px, 92vw);
      box-shadow: var(--glow-t);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }
    .settings-title {
      font-family: 'Orbitron', monospace;
      font-size: 16px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--teal), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 900;
    }
    .settings-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
    }
    .settings-input {
      background: rgba(0, 229, 204, 0.04);
      border: 1px solid rgba(0, 229, 204, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      transition: border-color 0.2s ease;
    }
    .settings-input:focus {
      border-color: rgba(0, 229, 204, 0.4);
    }
    .settings-help {
      font-size: 10.5px;
      color: var(--muted);
      line-height: 1.4;
    }
    .settings-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 8px;
    }
    .settings-btn-cancel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 16px;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
    }
    .settings-btn-save {
      background: linear-gradient(135deg, var(--teal), var(--teal2));
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
    }

    /* Markdown helper stylings */
    strong { color: var(--gold); font-weight: 600; }
    em { color: var(--teal); font-style: normal; }
  </style>
</head>
<body>

  <!-- Background Canvas and Ambient Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <canvas id="bg-canvas"></canvas>

  <!-- Main Chat Application Shell -->
  <div id="app">
    <!-- Header -->
    <header>
      <div class="bot-avatar" aria-hidden="true">🤖</div>
      <div class="header-info">
        <h1 class="bot-name">HARI BOT</h1>
        <div class="bot-subtitle">
          <span class="status-dot"></span>
          ONLINE · PERSONALIZED AI · RESILIENT-RAG
        </div>
      </div>
      <div class="header-tags">
        <span class="htag">REIKI</span>
        <span class="htag">CHESS</span>
        <span class="htag">RCB 🔴</span>
      </div>
      <!-- Settings Panel Trigger Button -->
      <button id="settings-btn" title="Bot Configuration" aria-label="Settings">⚙️</button>
    </header>

    <!-- Connection / Status Banner -->
    <div id="offline-banner" style="display: none; padding: 6px 16px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; flex-shrink: 0; z-index: 15;"></div>

    <!-- Messages Container -->
    <main id="messages"></main>

    <!-- Suggestions Container -->
    <section id="suggestions" aria-label="Suggested Questions"></section>

    <!-- Interactive Input Panel -->
    <section id="input-area">
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Ask me anything about Hariharan..." maxlength="300" autocomplete="off" autocapitalize="sentences" spellcheck="true" aria-label="Chat input" />
        <button id="send-btn" type="submit" aria-label="Send message">➤</button>
      </form>
    </section>
    
    <footer class="powered">
      HARI BOT · Offline-Safe Hybrid RAG
    </footer>
  </div>

  <!-- Settings Dialog Modal -->
  <div id="settings-modal" aria-hidden="true" role="dialog">
    <div class="settings-card">
      <h2 class="settings-title">BOT CONFIGURATION</h2>

let cachedNews = "";
let lastNewsFetchTime = 0;

async function fetchLatestNewsContext() {
  const now = Date.now();
  if (cachedNews && (now - lastNewsFetchTime < 300000)) {
    return cachedNews;
  }
  
  try {
    const res = await fetch('https://saurav.tech/NewsAPI/top-headlines/category/general/in.json');
    if (res.ok) {
      const data = await res.json();
      if (data.articles && data.articles.length > 0) {
        const tnKeywords = ['tamil', 'chennai', 'coimbatore', 'madurai', 'stalin', 'tn', 'south india'];
        const tnArticles = data.articles.filter(a => {
          const content = `${a.title} ${a.description || ''}`.toLowerCase();
          return tnKeywords.some(kw => content.includes(kw));
        });
        
        const selectedArticles = [...tnArticles];
        for (const art of data.articles) {
          if (selectedArticles.length >= 6) break;
          if (!selectedArticles.some(a => a.url === art.url)) {
            selectedArticles.push(art);
          }
        }
        
        const headlines = selectedArticles.map((art, idx) => {
          return `${idx + 1}. [${art.source.name}] ${art.title} - ${art.description || ''}`;
        }).join('\n');
        
        cachedNews = `LATEST INDIA & TAMIL NADU NEWS:\n${headlines}\n\n`;
        lastNewsFetchTime = now;
        return cachedNews;
      }
    }
  } catch (e) {
    console.error("Failed to fetch live news:", e);
  }
  return "";
}

function launchEggs() {
  const overlay = document.getElementById('egg-overlay');
  overlay.style.display = 'block';
  overlay.innerHTML = '';

  // Prevent multiple overlapping NOPE tags
  const existingNope = document.getElementById('nope-msg');
  if (existingNope) existingNope.remove();

  // NOPE message banner
  const nope = document.createElement('div');
  nope.id = 'nope-msg';
  nope.innerHTML = '🚫 NONE OF YOUR BUSINESS! 🚫';
  document.body.appendChild(nope);

  let eggCount = 0;
  const MAX_EGGS = 18;
  const activeFrames = [];

  function spawnEgg() {
    if (eggCount >= MAX_EGGS) return;
    eggCount++;

    // Random start position: top, left, or right
    const side = Math.floor(Math.random() * 3);
    let startX, startY, velX, velY;
    const speed = 6 + Math.random() * 5;

    if (side === 0) {
      startX = Math.random() * window.innerWidth;
      startY = -50;
      velX = (Math.random() - 0.5) * 4;
      velY = speed;
    } else if (side === 1) {
      startX = -50;
      startY = Math.random() * window.innerHeight * 0.7;
      velX = speed;
      velY = 2 + Math.random() * 3;
    } else {
      startX = window.innerWidth + 50;
      startY = Math.random() * window.innerHeight * 0.7;
      velX = -speed;
      velY = 2 + Math.random() * 3;
    }

    const egg = document.createElement('div');
    egg.className = 'egg-el';
    egg.textContent = '🥚';
    egg.style.left = startX + 'px';
    egg.style.top = startY + 'px';
    egg.style.fontSize = (28 + Math.random() * 20) + 'px';
    overlay.appendChild(egg);

    let x = startX, y = startY;
    let rotation = 0;
    const rotSpeed = (Math.random() - 0.5) * 8;
    let animId;

    function animateEgg() {
      x += velX;
      y += velY;
      velY += 0.3; // Gravity pull
      rotation += rotSpeed;

      if (egg.parentNode) {
        egg.style.left = x + 'px';
        egg.style.top = y + 'px';
        egg.style.transform = `rotate(${rotation}deg)`;
      }

      // Splat triggers
      const hitFloor = y > window.innerHeight - 60;
      const hitLeft = x < 10;
      const hitRight = x > window.innerWidth - 60;
      const hitTop = y < 10 && side !== 0;

      if (hitFloor || hitLeft || hitRight || hitTop) {
        if (egg.parentNode) {
          egg.remove();
          createSplat(x, y, hitFloor);
        }
        return;
      }
      animId = requestAnimationFrame(animateEgg);
      activeFrames.push(animId);
    }
    animId = requestAnimationFrame(animateEgg);
    activeFrames.push(animId);

    setTimeout(spawnEgg, 180 + Math.random() * 220);
  }

  spawnEgg();

  // Garbage collect all frames and DOM overlays
  setTimeout(() => {
    activeFrames.forEach(id => cancelAnimationFrame(id));
    overlay.style.display = 'none';
    overlay.innerHTML = '';
    const n = document.getElementById('nope-msg');
    if (n) n.remove();
  }, 5200);
}

// ============================================================
// CONTROLLER SEND LOGIC (HYBRID DIRECT-GEMINI/OPENROUTER PIPELINE)
// ============================================================
async function sendMessage(text) {
  text = text.trim();
  if (!text) return;

  // Run synchronously to avoid popup blocker
  checkAndOpenLink(text);

  addUserMsg(text);
  
  if (suggestionsShown) {
    document.getElementById('suggestions').style.display = 'none';
    suggestionsShown = false;
  }

  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  const trigger = detectTrigger(text);

  if (trigger === 'CRUSH') {
    showTyping();
    await sleep(700);
    hideTyping();
    addBotMsg("🚫 **ACCESSING CLASSIFIED FILES...**\n\n**ALERT! ALERT!** That information is **TOP SECRET** and strictly confidential! 🙅‍♂️\n\nHave some eggs instead! 🥚");
    launchEggs();
    btn.disabled = false;
    return;
  }

  if (trigger === 'BESTFRIEND') {
    showTyping();
    await sleep(600);
    hideTyping();
    addBotMsg("🤖 Hariharan's **best friend is AI** — that's literally me, **HARI BOT**! 😄\n\nNow stop being nosy and **do your own work!** 😂 Hariharan's busy building the future!");
    btn.disabled = false;
    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: "Hariharan's best friend is AI!" });
    return;
  }

  showTyping();

  const t = text.toLowerCase();
  const isNewsQuery = t.includes('news') || t.includes('happening') || t.includes('latest info') || t.includes('current affairs') || t.includes('tamil nadu') || t.includes('india');

  // If both keys are missing or client is offline, intercept immediately with Local RAG fallback
  if ((!userGeminiKey && !userORKey) || !navigator.onLine) {
    await sleep(450); // Simulate bot reading time
    let localReply = "";
    if (isNewsQuery && navigator.onLine) {
      localReply = await getLocalNewsResponse();
    } else {
      localReply = getLocalResponse(text);
    }
    hideTyping();
    addBotMsg(localReply);
    
    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: localReply });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
    
    btn.disabled = false;
    return;
  }

  // Fetch live news headlines context if requested
  let newsContext = "";
  if (isNewsQuery) {
    newsContext = await fetchLatestNewsContext();
  }

  // System Prompt
  const system = `You are HARI BOT — a witty, warm, and highly personalized AI assistant for Hariharan, a 17-year-old Mechatronics Engineering student at SNS College of Technology in Coimbatore. Keep all responses crisp, concise (1-3 sentences max), and engaging. Use emojis naturally.

IMPORTANT: Communicate exclusively in English or Tamil. Do not respond in Hindi or any other languages.

Answer queries about Hariharan using the Knowledge Base below. If the user asks something new, general, or unrelated to Hariharan, use your own intelligence (Gemini) to answer their question directly, clearly, and crisply! Do not refuse general questions or say "I don't know" if it's a general query (like math, science, programming, general facts, etc.).

If the user asks mechatronics, engineering, mathematics, or physics questions, guide them patiently through the concept. Explain clearly and tutor them step-by-step. In your answer, proudly mention that Mechatronics and Robotics is Hariharan's specialized field of study at SNS College of Technology!

KNOWLEDGE BASE:
${HARI_KB}

PERSONALITY RULES:
- Age question → explicitly answer that Hariharan is **17 years old**. Do not only reply with his DOB; state his age is 17!
- Favorite Cricket Team / RCB / IPL question → you must SHOUT: "**EE SALA CUP NAMDU!!!** 🔴🏆🔴🏆" and explain his love for RCB and AB de Villiers.
- Biriyani question → get SUPER excited 🍛
- Healing questions (Reiki, Ama-Deus, Sujok) → explain with care and pride — this is Hariharan's special gift and his association with the Agasthiya Healing Centre!
- Chess → celebrate his STATE-LEVEL achievement with pride ♟️
- Tea vs Coffee → he loves BOTH, refuses to pick
- Vijay → big fan energy!
- Use **bold** for key terms and *italics* for emphasis
- Be fun and personal, not robotic`;

  const dynamicSystemPrompt = system + (newsContext ? `\n\nUse the following live news context to answer queries about latest happenings in Tamil Nadu or India:\n${newsContext}` : "");

  try {
    let responseStream;
    let isGeminiDirect = !!userGeminiKey;

    if (isGeminiDirect) {
      // 1. Call Native Google Gemini API with SSE
      const contentsArray = chatHistory.map(msg => ({
        role: msg.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: msg.content }]
      }));
      contentsArray.push({
        role: 'user',
        parts: [{ text: text }]
      }));

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);

      responseStream = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?alt=sse&key=${userGeminiKey}`, {
        method: 'POST',
        signal: controller.signal,
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: contentsArray,
          systemInstruction: {
            parts: [{ text: dynamicSystemPrompt }]
          }
        })
      });
      clearTimeout(timeout);
    } else {
      // 2. Call OpenRouter API completion fallback with SSE
      const messages = [
        { role: 'system', content: dynamicSystemPrompt },
        ...chatHistory,
        { role: 'user', content: text }
      ];

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);

      responseStream = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        signal: controller.signal,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${userORKey}`,
          'HTTP-Referer': 'https://hariharanmct06.github.io',
          'X-Title': 'HARI BOT'
        },
        body: JSON.stringify({
          model: 'google/gemini-2.5-flash',
          max_tokens: 800,
          messages,
          stream: true
        })
      });
      clearTimeout(timeout);
    }

    if (!responseStream.ok) {
      throw new Error(`HTTP Request Fail: ${responseStream.status}`);
    }

    hideTyping();

    // Create message bubble in messages list
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `
      <div class="msg-icon">🤖</div>
      <div class="bubble"></div>
    `;
    msgs.appendChild(div);
    const bubble = div.querySelector('.bubble');
    scrollBottom();

    const reader = responseStream.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let reply = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');
      
      for (const line of lines) {
        const cleanLine = line.trim();
        if (cleanLine.startsWith('data: ')) {
          if (cleanLine.includes('[DONE]')) break;
          try {
            const parsed = JSON.parse(cleanLine.slice(6));
            let content = "";
            
            if (isGeminiDirect) {
              // Parse Google Gemini direct SSE chunk structure
              content = parsed.candidates?.[0]?.content?.parts?.[0]?.text || "";
            } else {
              // Parse OpenRouter SSE chunk structure
              content = parsed.choices?.[0]?.delta?.content || "";
            }
            
            reply += content;
            bubble.innerHTML = formatMarkdown(reply);
            scrollBottom();
          } catch(e) {
            // ignore partial line parse errors
          }
        }
      }
    }

    // Shout visual triggers
    if (reply.includes("EE SALA CUP NAMDU")) {
      bubble.classList.add('shout-bubble');
    }

    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: reply });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

  } catch(e) {
    hideTyping();
    // Clean up empty bubbles if error thrown
    const botMessages = document.querySelectorAll('.msg.bot');
    const lastBotMsg = botMessages[botMessages.length - 1];
    if (lastBotMsg && !lastBotMsg.querySelector('.bubble').textContent) {
      lastBotMsg.remove();
    }

    const localReply = getLocalResponse(text);
    addBotMsg(localReply + "\n\n*(Sent via Offline Local Engine)*");
    
    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: localReply });
  }

  btn.disabled = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// MOBILE KEYBOARD AND VIEWPORT MANAGEMENT
// ============================================================
function adjustViewport() {
  const vv = window.visualViewport;
  if (!vv) return;

  const app = document.getElementById('app');
  if (!app) return;

  if (window.innerWidth < 600) {
    // Dynamically size app container height to match visual height minus keyboard
    app.style.height = `${vv.height}px`;
    // Place container at offset top to prevent iOS text input displacement
    app.style.top = `${vv.offsetTop}px`;
    
    // Force browser window window viewport scroll position to origin
    window.scrollTo(0, 0);
  } else {
    // Reset styling for standard desktop dimensions
    app.style.height = '';
    app.style.top = '';
  }
  
  setTimeout(scrollBottom, 50);
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', adjustViewport);
  window.visualViewport.addEventListener('scroll', adjustViewport);
}

// ============================================================
// EFFICIENT PARTICLES CANVAS BACKGROUND
// ============================================================
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let lastWidth = 0;
let lastHeight = 0;
let particles = [];

function resizeCanvas() {
  const currentWidth = window.innerWidth;
  const currentHeight = window.innerHeight;

  // Prevent redrawing/flickering for micro-height updates (keyboard toggling)
  if (Math.abs(currentWidth - lastWidth) > 10 || Math.abs(currentHeight - lastHeight) > 120) {
    canvas.width = currentWidth;
    canvas.height = currentHeight;
    lastWidth = currentWidth;
    lastHeight = currentHeight;
    initParticles();
  }
}

function initParticles() {
  // Mobile gets 22 particles to conserve CPU, desktop gets 55
  const maxParticles = window.innerWidth < 600 ? 22 : 55;
  particles = Array.from({ length: maxParticles }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    r: Math.random() * 1.3 + 0.4,
    c: Math.random() > 0.5 ? 'rgba(0, 229, 204,' : 'rgba(245, 166, 35,'
  }));
}

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.c + '0.55)';
    ctx.fill();

    // Draw networking connection threads between particles
    particles.forEach(p2 => {
      const d = Math.hypot(p.x - p2.x, p.y - p2.y);
      if (d < 85) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = p.c + (0.06 * (1 - d / 85)) + ')';
        ctx.lineWidth = 0.45;
        ctx.stroke();
      }
    });
  });
  
  requestAnimationFrame(drawParticles);
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
drawParticles();

  // iOS Safari touch bouncing fix
  document.addEventListener('touchmove', e => {
