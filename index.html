<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07090f">
  
  <title>HARI BOT — Your Personal AI Portfolio Companion</title>
  <meta name="description" content="Meet HARI BOT, the interactive AI companion for Hariharan. Learn about his mechatronics engineering studies, technical projects, programming skills, and more.">  <!-- External Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030712; /* Deep modern dark space */
      --bg2: #0b0f19;
      --bg3: #111827;
      --surface: rgba(15, 23, 42, 0.65); /* Modern slate glass */
      --accent: #6366f1; /* Indigo */
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.2);
      --teal: #10b981; /* Emerald status */
      --gold: #f59e0b; /* Amber */
      --text: #f8fafc; /* Crisp off-white */
      --muted: #64748b; /* Slate grey */
      --border: rgba(255, 255, 255, 0.08); /* Clean, ultra-thin border */
      --border-hover: rgba(99, 102, 241, 0.25);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
    }

    body {
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      position: fixed;
      width: 100%;
      inset: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
      animation: blobFloat 12s ease-in-out infinite;
    }
    .blob1 { width: 600px; height: 600px; background: var(--accent); top: -150px; left: -150px; animation-delay: 0s; }
    .blob2 { width: 500px; height: 500px; background: #8b5cf6; bottom: -120px; right: -120px; animation-delay: 4s; }
    .blob3 { width: 400px; height: 400px; background: var(--teal); bottom: 25%; left: 20%; animation-delay: 8s; }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.08); }
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-image:
        linear-gradient(rgba(99, 102, 241, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.015) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    #app {
      position: relative;
      z-index: 10;
      width: min(780px, 100vw);
      height: 100vh;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      background: rgba(11, 17, 30, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
    }

    @media (min-width: 600px) {
      #app {
        width: min(780px, 95vw);
        height: min(85vh, 800px);
        border-radius: 20px;
        border: 1px solid var(--border);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.03),
          0 30px 70px rgba(0, 0, 0, 0.6),
          0 0 50px rgba(99, 102, 241, 0.03);
      }
    }

    @media (max-width: 599px) {
      #app {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }
    }

    header {
      padding: 14px 20px;
      padding-top: max(14px, env(safe-area-inset-top));
      background: rgba(11, 17, 30, 0.4);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      position: relative;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--teal), transparent);
      opacity: 0.25;
    }

    .bot-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.3);
      position: relative;
    }

    .header-info { flex: 1; min-width: 0; }
    h1.bot-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bot-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 6px var(--teal);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .header-tags {
      display: none;
      gap: 6px;
      align-items: center;
    }
    @media (min-width: 480px) { .header-tags { display: flex; } }
    .htag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      transition: all 0.2s ease;
    }
    .htag:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(99, 102, 241, 0.06);
    }

    #settings-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      outline: none;
      user-select: none;
    }
    #settings-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.08) transparent;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
    @media (min-width: 600px) {
      #messages { padding: 28px 32px; }
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 6px; }
    #messages::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.2); }

    .msg {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      animation: msgIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { flex-direction: row-reverse; }

    .msg-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      user-select: none;
    }
    .msg.bot .msg-icon {
      background: rgba(99, 102, 241, 0.08);
      border-color: rgba(99, 102, 241, 0.2);
      color: var(--accent);
    }

    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.6;
      position: relative;
      word-break: break-word;
    }
    @media (min-width: 600px) {
      .bubble { max-width: 75%; padding: 13px 18px; }
    }
    .msg.bot .bubble {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .msg.user .bubble {
      background: var(--accent);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
    }

    @keyframes shoutGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.35); border-color: rgba(239, 68, 68, 0.3); }
      50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.65); border-color: rgba(239, 68, 68, 0.6); }
    }
    @keyframes shoutShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      15%, 45%, 75% { transform: rotate(-1.5deg) scale(1.02); }
      30%, 60%, 90% { transform: rotate(1.5deg) scale(1.02); }
    }
    .msg.bot .bubble.shout-bubble {
      animation: shoutShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both, shoutGlow 1.5s infinite alternate;
      border: 1px solid rgba(239, 68, 68, 0.4) !important;
      background: rgba(239, 68, 68, 0.08) !important;
      color: #f87171 !important;
      font-weight: 700 !important;
      font-size: 15px !important;
    }

    .typing-bubble {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 12px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .tdot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: tdot 1.3s ease-in-out infinite;
    }
    .tdot:nth-child(2) { animation-delay: .18s; }
    .tdot:nth-child(3) { animation-delay: .36s; }
    @keyframes tdot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    #suggestions {
      padding: 0 16px 10px;
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-x;
    }
    #suggestions::-webkit-scrollbar { display: none; }
    @media (min-width: 600px) {
      #suggestions { padding: 0 32px 14px; flex-wrap: wrap; overflow-x: visible; }
    }
    
    .sugg {
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      min-height: 36px;
      user-select: none;
      outline: none;
    }
    .sugg:active, .sugg:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(99, 102, 241, 0.06);
    }

    #input-area {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-top));
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      background: rgba(11, 17, 30, 0.4);
    }
    @media (min-width: 600px) {
      #input-area { padding: 18px 32px 24px; gap: 12px; }
    }

    #chat-form {
      display: flex;
      width: 100%;
      gap: 10px;
      align-items: center;
    }

    #chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      outline: none;
      resize: none;
      height: 48px;
      transition: all 0.2s ease;
      -webkit-appearance: none;
      touch-action: manipulation;
    }
    #chat-input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.12);
    }
    #chat-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 12px;
      flex-shrink: 0;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
      touch-action: manipulation;
      user-select: none;
    }
    #send-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
    }
    #send-btn:active { transform: translateY(1px); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

    footer.powered {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: rgba(148, 163, 184, 0.3);
      padding: 0 0 10px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      user-select: none;
      background: rgba(11, 17, 30, 0.4);
    }

    #egg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      pointer-events: none;
      overflow: hidden;
    }
    .egg-el {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      font-size: 36px;
      transform-origin: center center;
      user-select: none;
    }
    #nope-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100000;
      pointer-events: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(16px, 4.5vw, 24px);
      font-weight: 800;
      color: #ef4444;
      text-align: center;
      text-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
      white-space: nowrap;
      animation: nopePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      user-select: none;
    }
    @keyframes nopePop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes splatAnim {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.3) rotate(15deg); opacity: 1; }
      100% { transform: scale(1) rotate(10deg); opacity: 0; }
    }

    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.8);
      z-index: 20000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .settings-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 28px;
      border-radius: 16px;
      width: min(440px, 92vw);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 45px rgba(99, 102, 241, 0.04);
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
    }
    .settings-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 17px;
      letter-spacing: -0.2px;
      color: var(--text);
      font-weight: 700;
    }
    .settings-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .settings-input {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s ease;
    }
    .settings-input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.04);
    }
    .settings-help {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }
    .settings-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .settings-btn-cancel {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .settings-btn-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .settings-btn-save {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s ease;
    }
    .settings-btn-save:hover {
      background: var(--accent-hover);
    }

    strong { color: var(--gold); font-weight: 600; }
    em { color: var(--accent); font-style: normal; }
  </style>
</head>
<body>

  <!-- Background Canvas and Ambient Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <canvas id="bg-canvas"></canvas>

  <!-- Main Chat Application Shell -->
  <div id="app">
    <!-- Header -->
    <header>
      <div class="bot-avatar" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M12 2v2"/></svg>
      </div>
      <div class="header-info">
        <h1 class="bot-name">HARI BOT</h1>
        <div class="bot-subtitle">
          <span class="status-dot"></span>
          ONLINE · PERSONALIZED AI · RESILIENT-RAG
        </div>
      </div>
      <div class="header-tags">
        <span class="htag">MECHATRONICS</span>
        <span class="htag">ROBOTICS</span>
        <span class="htag">REIKI</span>
      </div>
      <!-- Settings Panel Trigger Button -->
      <button id="settings-btn" title="Bot Configuration" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <!-- Connection / Status Banner -->
    <div id="offline-banner" style="display: none; padding: 6px 16px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; flex-shrink: 0; z-index: 15;"></div>

    <!-- Messages Container -->
    <main id="messages"></main>

    <!-- Suggestions Container -->
    <section id="suggestions" aria-label="Suggested Questions"></section>

    <!-- Interactive Input Panel -->
    <section id="input-area">
      <form id="chat-form">

let cachedNews = "";
let lastNewsFetchTime = 0;

async function fetchLatestNewsContext() {
  const now = Date.now();
  if (cachedNews && (now - lastNewsFetchTime < 300000)) {
    return cachedNews;
  }
  
  try {
    const res = await fetch('https://saurav.tech/NewsAPI/top-headlines/category/general/in.json');
    if (res.ok) {
      const data = await res.json();
      if (data.articles && data.articles.length > 0) {
        const tnKeywords = ['tamil', 'chennai', 'coimbatore', 'madurai', 'stalin', 'tn', 'south india'];
        const tnArticles = data.articles.filter(a => {
          const content = `${a.title} ${a.description || ''}`.toLowerCase();
          return tnKeywords.some(kw => content.includes(kw));
        });
        
        const selectedArticles = [...tnArticles];
        for (const art of data.articles) {
          if (selectedArticles.length >= 6) break;
          if (!selectedArticles.some(a => a.url === art.url)) {
            selectedArticles.push(art);
          }
        }
        
        const headlines = selectedArticles.map((art, idx) => {
          return `${idx + 1}. [${art.source.name}] ${art.title} - ${art.description || ''}`;
        }).join('\n');
        
        cachedNews = `LATEST INDIA & TAMIL NADU NEWS:\n${headlines}\n\n`;
        lastNewsFetchTime = now;
        return cachedNews;
      }
    }
  } catch (e) {
    console.error("Failed to fetch live news:", e);
  }
  return "";
}

function launchEggs() {
  const overlay = document.getElementById('egg-overlay');
  overlay.style.display = 'block';
  overlay.innerHTML = '';

  // Prevent multiple overlapping NOPE tags
  const existingNope = document.getElementById('nope-msg');

  nope.id = 'nope-msg';
  nope.innerHTML = '🚫 NONE OF YOUR BUSINESS! 🚫';
  document.body.appendChild(nope);

  let eggCount = 0;
  const MAX_EGGS = 18;
  const activeFrames = [];

  function spawnEgg() {
    if (eggCount >= MAX_EGGS) return;
    eggCount++;

    // Random start position: top, left, or right
    const side = Math.floor(Math.random() * 3);
    let startX, startY, velX, velY;
    const speed = 6 + Math.random() * 5;

    if (side === 0) {
      startX = Math.random() * window.innerWidth;
      startY = -50;
      velX = (Math.random() - 0.5) * 4;
      velY = speed;
    } else if (side === 1) {
      startX = -50;
      startY = Math.random() * window.innerHeight * 0.7;
      velX = speed;
      velY = 2 + Math.random() * 3;
    } else {
      startX = window.innerWidth + 50;
      startY = Math.random() * window.innerHeight * 0.7;
      velX = -speed;
      velY = 2 + Math.random() * 3;
    }

    const egg = document.createElement('div');
    egg.className = 'egg-el';
    egg.textContent = '🥚';
    egg.style.left = startX + 'px';
    egg.style.top = startY + 'px';
    egg.style.fontSize = (28 + Math.random() * 20) + 'px';
    overlay.appendChild(egg);

    let x = startX, y = startY;
    let rotation = 0;
    const rotSpeed = (Math.random() - 0.5) * 8;
    let animId;

    function animateEgg() {
      x += velX;
      y += velY;
      velY += 0.3; // Gravity pull
      rotation += rotSpeed;

      if (egg.parentNode) {
        egg.style.left = x + 'px';
        egg.style.top = y + 'px';
        egg.style.transform = `rotate(${rotation}deg)`;
      }

      // Splat triggers
      const hitFloor = y > window.innerHeight - 60;
      const hitLeft = x < 10;
      const hitRight = x > window.innerWidth - 60;
      const hitTop = y < 10 && side !== 0;

      if (hitFloor || hitLeft || hitRight || hitTop) {
        if (egg.parentNode) {
          egg.remove();
          createSplat(x, y, hitFloor);
        }
        return;
      }
      animId = requestAnimationFrame(animateEgg);
      activeFrames.push(animId);
    }
    animId = requestAnimationFrame(animateEgg);
    activeFrames.push(animId);

    setTimeout(spawnEgg, 180 + Math.random() * 220);
  }

  spawnEgg();

  // Garbage collect all frames and DOM overlays
  setTimeout(() => {
    activeFrames.forEach(id => cancelAnimationFrame(id));
    overlay.style.display = 'none';
    overlay.innerHTML = '';
    const n = document.getElementById('nope-msg');
    if (n) n.remove();
  }, 5200);
}

// ============================================================
async function sendMessage(text) {
  text = text.trim();
  if (!text) return;

  // Run synchronously to avoid popup blocker
  checkAndOpenLink(text);

  addUserMsg(text);
  
  if (suggestionsShown) {
    document.getElementById('suggestions').style.display = 'none';
    suggestionsShown = false;
  }

  const btn = document.getElementById('send-btn');
  btn.disabled = true;

  const trigger = detectTrigger(text);

  if (trigger === 'CRUSH') {
    showTyping();
    await sleep(700);
    hideTyping();
    addBotMsg("🚫 **ACCESSING CLASSIFIED FILES...**\n\n**ALERT! ALERT!** That information is **TOP SECRET** and strictly confidential! 🙅‍♂️\n\nHave some eggs instead! 🥚");
    launchEggs();
    btn.disabled = false;
    return;
  }

  if (trigger === 'BESTFRIEND') {
    showTyping();
    await sleep(600);
    hideTyping();
    addBotMsg("🤖 Hariharan's **best friend is AI** — that's literally me, **HARI BOT**! 😄\n\nNow stop being nosy and **do your own work!** 😂 Hariharan's busy building the future!");
    btn.disabled = false;
    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: "Hariharan's best friend is AI!" });
    return;
  }

  showTyping();

  const t = text.toLowerCase();
  const isNewsQuery = t.includes('news') || t.includes('happening') || t.includes('latest info') || t.includes('current affairs') || t.includes('tamil nadu') || t.includes('india');

  // If both keys are missing or client is offline, intercept immediately with Local RAG fallback
  if ((!userGeminiKey && !userORKey) || !navigator.onLine) {
    await sleep(450); // Simulate bot reading time
    let localReply = "";
    if (isNewsQuery && navigator.onLine) {
      localReply = await getLocalNewsResponse();
    } else {
      localReply = getLocalResponse(text);
    }
    hideTyping();
    addBotMsg(localReply);
    
    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: localReply });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);
    
    btn.disabled = false;
    return;
  }

  // Fetch live news headlines context if requested
  let newsContext = "";
  if (isNewsQuery) {
    newsContext = await fetchLatestNewsContext();
  }

  // System Prompt
  const system = `You are HARI BOT — a witty, warm, and highly personalized AI assistant for Hariharan, a 17-year-old Mechatronics Engineering student at SNS College of Technology in Coimbatore. Keep all responses crisp, concise (1-3 sentences max), and engaging. Use emojis naturally.

IMPORTANT: Communicate exclusively in English or Tamil. Do not respond in Hindi or any other languages.

Answer queries about Hariharan using the Knowledge Base below. If the user asks something new, general, or unrelated to Hariharan, use your own intelligence (Gemini) to answer their question directly, clearly, and crisply! Do not refuse general questions or say "I don't know" if it's a general query (like math, science, programming, general facts, etc.).

If the user asks mechatronics, engineering, mathematics, or physics questions, guide them patiently through the concept. Explain clearly and tutor them step-by-step. In your answer, proudly mention that Mechatronics and Robotics is Hariharan's specialized field of study at SNS College of Technology!

KNOWLEDGE BASE:
${HARI_KB}

PERSONALITY RULES:
- Age question → explicitly answer that Hariharan is **17 years old**. Do not only reply with his DOB; state his age is 17!
- Healing questions (Reiki, Ama-Deus, Sujok) → explain with care and pride — this is Hariharan's special gift and his association with the Agasthiya Healing Centre!
- Tea vs Coffee → he loves BOTH, refuses to pick
- Vijay → big fan energy!
- Use **bold** for key terms and *italics* for emphasis
- Be fun and personal, not robotic`;

  const calendarContext = `\n\nCURRENT DATE & TIME:\nToday is ${new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}. The current time is ${new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true })}.`;
  const dynamicSystemPrompt = system + calendarContext + (newsContext ? `\n\nUse the following live news context to answer queries about latest happenings in Tamil Nadu or India:\n${newsContext}` : "");

  try {
    let responseStream;
    let isGeminiDirect = !!userGeminiKey;

    if (isGeminiDirect) {
      // 1. Call Native Google Gemini API with SSE
      const contentsArray = chatHistory.map(msg => ({
        role: msg.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: msg.content }]
      }));
      contentsArray.push({
        role: 'user',
        parts: [{ text: text }]
      });

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);

      responseStream = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?alt=sse&key=${userGeminiKey}`, {
        method: 'POST',
        signal: controller.signal,
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          contents: contentsArray,
          systemInstruction: {
            parts: [{ text: dynamicSystemPrompt }]
          }
        })
      });
      clearTimeout(timeout);
    } else {
      // 2. Call OpenRouter API completion fallback with SSE
      const messages = [
        { role: 'system', content: dynamicSystemPrompt },
        ...chatHistory,
        { role: 'user', content: text }
      ];

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);

      responseStream = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        signal: controller.signal,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${userORKey}`,
          'HTTP-Referer': 'https://hariharanmct06.github.io',
          'X-Title': 'HARI BOT'
        },
        body: JSON.stringify({
          model: 'google/gemini-2.5-flash',
          max_tokens: 800,
          messages,
          stream: true
        })
      });
      clearTimeout(timeout);
    }

    if (!responseStream.ok) {
      throw new Error(`HTTP Request Fail: ${responseStream.status}`);
    }

    hideTyping();

    // Create message bubble in messages list
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `
      <div class="msg-icon">🤖</div>
      <div class="bubble"></div>
    `;
    msgs.appendChild(div);
    const bubble = div.querySelector('.bubble');
    scrollBottom();

    const reader = responseStream.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let reply = "";
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      
      for (const line of lines) {
        const cleanLine = line.trim();
        if (cleanLine.startsWith('data: ')) {
          if (cleanLine.includes('[DONE]')) break;
          try {
            const parsed = JSON.parse(cleanLine.slice(6));
            let content = "";
            
            if (isGeminiDirect) {
              // Parse Google Gemini direct SSE chunk structure
              content = parsed.candidates?.[0]?.content?.parts?.[0]?.text || "";
            } else {
              // Parse OpenRouter SSE chunk structure
              content = parsed.choices?.[0]?.delta?.content || "";
            }
            
            reply += content;
            bubble.innerHTML = formatMarkdown(reply);
            scrollBottom();
          } catch(e) {
            // ignore partial line parse errors
          }
        }
      }
    }

    // Shout visual triggers
    if (reply.includes("EE SALA CUP NAMDU")) {
      bubble.classList.add('shout-bubble');
    }

    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: reply });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

  } catch(e) {
    hideTyping();
    // Clean up empty bubbles if error thrown
    const botMessages = document.querySelectorAll('.msg.bot');
    const lastBotMsg = botMessages[botMessages.length - 1];
    if (lastBotMsg && !lastBotMsg.querySelector('.bubble').textContent) {
      lastBotMsg.remove();
    }

    const localReply = getLocalResponse(text);
    addBotMsg(localReply + "\n\n*(Sent via Offline Local Engine)*");
    
    chatHistory.push({ role: 'user', content: text });
    chatHistory.push({ role: 'assistant', content: localReply });
  }

  btn.disabled = false;
}

function adjustViewport() {
  const vv = window.visualViewport;
  if (!vv) return;

  const app = document.getElementById('app');
  if (!app) return;

  if (window.innerWidth < 600) {
    // Dynamically size app container height to match visual height minus keyboard
    app.style.height = `${vv.height}px`;
    // Place container at offset top to prevent iOS text input displacement
    app.style.top = `${vv.offsetTop}px`;
    
    // Force browser window window viewport scroll position to origin
    window.scrollTo(0, 0);
  } else {
    // Reset styling for standard desktop dimensions
    app.style.height = '';
    app.style.top = '';
  }
  
  setTimeout(scrollBottom, 50);
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', adjustViewport);
  window.visualViewport.addEventListener('scroll', adjustViewport);
}

// ============================================================
// EFFICIENT PARTICLES CANVAS BACKGROUND
// ============================================================
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let lastWidth = 0;
let lastHeight = 0;
let particles = [];

function resizeCanvas() {
  const currentWidth = window.innerWidth;
  const currentHeight = window.innerHeight;

  // Prevent redrawing/flickering for micro-height updates (keyboard toggling)
  if (Math.abs(currentWidth - lastWidth) > 10 || Math.abs(currentHeight - lastHeight) > 120) {
    canvas.width = currentWidth;
    canvas.height = currentHeight;
    lastWidth = currentWidth;
    lastHeight = currentHeight;
    initParticles();
  }
}

function initParticles() {
  // Mobile gets 22 particles to conserve CPU, desktop gets 55
  const maxParticles = window.innerWidth < 600 ? 22 : 55;
  particles = Array.from({ length: maxParticles }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    r: Math.random() * 1.3 + 0.4,
    c: Math.random() > 0.5 ? 'rgba(99, 102, 241,' : 'rgba(16, 185, 129,'
  }));
}

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.c + '0.55)';
    ctx.fill();

    // Draw networking connection threads between particles
    particles.forEach(p2 => {
      const d = Math.hypot(p.x - p2.x, p.y - p2.y);
      if (d < 85) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = p.c + (0.06 * (1 - d / 85)) + ')';
        ctx.lineWidth = 0.45;
        ctx.stroke();
      }
    });
  });
  
  requestAnimationFrame(drawParticles);
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
drawParticles();
