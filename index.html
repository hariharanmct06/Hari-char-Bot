<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07090f">
  
  <title>HARI BOT — Your Personal AI Portfolio Companion</title>
  <meta name="description" content="Meet HARI BOT, the interactive AI companion for Hariharan. Learn about his mechatronics engineering studies, technical projects, programming skills, and more.">  <!-- External Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000; /* Pure black space */
      --bg2: #050508; /* Deep cosmic dark */
      --bg3: #0c0c10; /* Charcoal black */
      --surface: rgba(8, 8, 12, 0.7); /* Sleek translucent dark glass */
      
      --orange: #ff6b00; /* Electric Orange */
      --orange-rgb: 255, 107, 0;
      --green: #10b981; /* Neon Emerald Green */
      --green-rgb: 16, 185, 129;
      --blue: #00f0ff; /* Cyber Neon Blue */
      --blue-rgb: 0, 240, 255;
      
      --accent: var(--orange);
      --accent-hover: #ff8533;
      --accent-glow: rgba(255, 107, 0, 0.2);
      
      --text: #ffffff; /* Pure white text */
      --muted: #94a3b8; /* Soft slate grey */
      --border: rgba(255, 255, 255, 0.08); /* Clean white-border overlay */
      --border-hover: rgba(255, 255, 255, 0.18);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
    }

    body {
      height: 100%;
      height: -webkit-fill-available;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      position: fixed;
      width: 100%;
      inset: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
      animation: blobFloat 12s ease-in-out infinite;
    }
    .blob1 { width: 600px; height: 600px; background: var(--orange); top: -150px; left: -150px; opacity: 0.05; animation-delay: 0s; }
    .blob2 { width: 500px; height: 500px; background: var(--blue); bottom: -120px; right: -120px; opacity: 0.05; animation-delay: 4s; }
    .blob3 { width: 400px; height: 400px; background: var(--green); bottom: 25%; left: 20%; opacity: 0.03; animation-delay: 8s; }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.08); }
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.012) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    #app {
      position: relative;
      z-index: 10;
      width: min(780px, 100vw);
      height: 100vh;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      background: rgba(5, 5, 8, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.95);
    }

    @media (min-width: 600px) {
      #app {
        width: min(780px, 95vw);
        height: min(85vh, 800px);
        border-radius: 20px;
        border: 1px solid var(--border);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.03),
          0 30px 70px rgba(0, 0, 0, 0.9),
          0 0 50px rgba(0, 240, 255, 0.04);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }
      #app:hover {
        border-color: rgba(0, 240, 255, 0.25);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.05),
          0 30px 70px rgba(0, 0, 0, 0.95),
          0 0 60px rgba(0, 240, 255, 0.06),
          0 0 30px rgba(255, 107, 0, 0.03);
      }
    }

    @media (max-width: 599px) {
      #app {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }
    }

    header {
      padding: 14px 20px;
      padding-top: max(14px, env(safe-area-inset-top));
      background: rgba(0, 0, 0, 0.5);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
      position: relative;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--orange), var(--blue), var(--green), transparent);
      opacity: 0.65;
    }

    .bot-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--orange), var(--blue), var(--green));
      background-size: 200% 200%;
      animation: gradientFlow 6s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.3);
      position: relative;
    }
    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header-info { flex: 1; min-width: 0; }
    h1.bot-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bot-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .header-tags {
      display: none;
      gap: 6px;
      align-items: center;
    }
    @media (min-width: 480px) { .header-tags { display: flex; } }
    .htag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .htag:hover {
      border-color: var(--blue);
      color: var(--text);
      background: rgba(0, 240, 255, 0.06);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
    }

    #settings-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      outline: none;
      user-select: none;
    }
    #settings-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.08) transparent;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
    @media (min-width: 600px) {
      #messages { padding: 28px 32px; }
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 6px; }
    #messages::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, var(--orange), var(--blue), var(--green)); }

    .msg {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      animation: msgIn 0.3s cubic-bezier(0.25, 1, 0.5, 1) both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg.user { flex-direction: row-reverse; }

    .msg-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      user-select: none;
    }
    .msg.bot .msg-icon {
      background: rgba(0, 240, 255, 0.06);
      border-color: rgba(0, 240, 255, 0.2);
      color: var(--blue);
    }

    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.6;
      position: relative;
      word-break: break-word;
    }
    @media (min-width: 600px) {
      .bubble { max-width: 75%; padding: 13px 18px; }
    }
    .msg.bot .bubble {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-left: 3px solid var(--blue);
      color: var(--text);
      border-bottom-left-radius: 4px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .msg.user .bubble {
      background: linear-gradient(135deg, var(--orange) 0%, var(--blue) 100%);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(255, 107, 0, 0.2);
      border: none;
    }

    .bubble a {
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px dashed rgba(0, 240, 255, 0.4);
      transition: all 0.2s ease;
      font-weight: 600;
    }
    .bubble a:hover {
      color: var(--orange);
      border-bottom-color: var(--orange);
    }

    @keyframes shoutGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.35); border-color: rgba(239, 68, 68, 0.3); }
      50% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.65); border-color: rgba(239, 68, 68, 0.6); }
    }
    @keyframes shoutShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      15%, 45%, 75% { transform: rotate(-1.5deg) scale(1.02); }
      30%, 60%, 90% { transform: rotate(1.5deg) scale(1.02); }
    }
    .msg.bot .bubble.shout-bubble {
      animation: shoutShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both, shoutGlow 1.5s infinite alternate;
      border: 1px solid rgba(239, 68, 68, 0.4) !important;
      border-left: 3px solid rgba(239, 68, 68, 0.9) !important;
      background: rgba(239, 68, 68, 0.08) !important;
      color: #f87171 !important;
      font-weight: 700 !important;
      font-size: 15px !important;
    }

    .typing-bubble {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-left: 3px solid var(--blue);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 12px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .tdot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
      animation: tdot 1.3s ease-in-out infinite;
    }
    .tdot:nth-child(2) { animation-delay: .18s; background: var(--green); }
    .tdot:nth-child(3) { animation-delay: .36s; background: var(--orange); }
    @keyframes tdot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    #suggestions {
      padding: 0 16px 10px;
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-x;
    }
    #suggestions::-webkit-scrollbar { display: none; }
    @media (min-width: 600px) {
      #suggestions { padding: 0 32px 14px; flex-wrap: wrap; overflow-x: visible; }
    }
    
    .sugg {
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: rgba(255, 255, 255, 0.01);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
      min-height: 36px;
      user-select: none;
      outline: none;
    }
    .sugg:hover, .sugg:active {
      border-color: var(--green);
      color: #ffffff;
      background: rgba(16, 185, 129, 0.06);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.15);
      transform: translateY(-1px);
    }

    #input-area {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-top));
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.6);
    }
    @media (min-width: 600px) {
      #input-area { padding: 18px 32px 24px; gap: 12px; }
    }

    #chat-form {
      display: flex;
      width: 100%;
      gap: 10px;
      align-items: center;
    }

    #chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px 18px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      outline: none;
      resize: none;
      height: 48px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-appearance: none;
      touch-action: manipulation;
    }
    #chat-input:focus {
      border-color: var(--blue);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.18);
    }
    #chat-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 12px;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--orange), var(--blue));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.25);
      touch-action: manipulation;
      user-select: none;
    }
    #send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 240, 255, 0.4), 0 0 15px rgba(255, 107, 0, 0.3);
    }
    #send-btn:active { transform: translateY(1px); }
    #send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

    footer.powered {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: rgba(148, 163, 184, 0.3);
      padding: 0 0 10px;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      user-select: none;
      background: rgba(0, 0, 0, 0.6);
    }

    #egg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      pointer-events: none;
      overflow: hidden;
    }
    .egg-el {
      position: fixed;
      pointer-events: none;
      z-index: 99999;
      font-size: 36px;
      transform-origin: center center;
      user-select: none;
    }
    #nope-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100000;
      pointer-events: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(16px, 4.5vw, 24px);
      font-weight: 800;
      color: #ef4444;
      text-align: center;
      text-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
      white-space: nowrap;
      animation: nopePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      user-select: none;
    }
    @keyframes nopePop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    @keyframes splatAnim {
      0% { transform: scale(0) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.3) rotate(15deg); opacity: 1; }
      100% { transform: scale(1) rotate(10deg); opacity: 0; }
    }

    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .settings-card {
      background: var(--bg2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 28px;
      border-radius: 16px;
      width: min(440px, 92vw);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.95), 0 0 45px rgba(0, 240, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
    }
    .settings-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 17px;
      letter-spacing: -0.2px;
      color: var(--text);
      font-weight: 700;
    }
    .settings-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }
    .settings-input {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: 'JetBrains Mono', monospace;
      transition: all 0.2s ease;
    }
    .settings-input:focus {
      border-color: var(--blue);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }
    .settings-help {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }
    .settings-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .settings-btn-cancel {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .settings-btn-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .settings-btn-save {
      background: linear-gradient(135deg, var(--orange), var(--blue));
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 240, 255, 0.2);
    }
    .settings-btn-save:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 240, 255, 0.35);
    }

    strong { color: #ffffff; font-weight: 700; }
    em { color: var(--orange); font-style: normal; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Background Canvas and Ambient Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <canvas id="bg-canvas"></canvas>

  <!-- Main Chat Application Shell -->
  <div id="app">
    <!-- Header -->
    <header>
      <div class="bot-avatar" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M12 2v2"/></svg>
      </div>
      <div class="header-info">
        <h1 class="bot-name">HARI BOT</h1>
        <div class="bot-subtitle">
          <span class="status-dot"></span>
          ONLINE · PERSONALIZED AI · RESILIENT-RAG
        </div>
      </div>
      <div class="header-tags">

let cachedNews = "";
let lastNewsFetchTime = 0;

async function fetchLatestNewsContext() {
  const now = Date.now();
  if (cachedNews && (now - lastNewsFetchTime < 300000)) {
    return cachedNews;
  }
  
  try {
    const res = await fetch('https://saurav.tech/NewsAPI/top-headlines/category/general/in.json');
    if (res.ok) {
      const data = await res.json();
      if (data.articles && data.articles.length > 0) {
        const tnKeywords = ['tamil', 'chennai', 'coimbatore', 'madurai', 'stalin', 'tn', 'south india'];
        const tnArticles = data.articles.filter(a => {
          const content = `${a.title} ${a.description || ''}`.toLowerCase();
          return tnKeywords.some(kw => content.includes(kw));
        });
        
        const selectedArticles = [...tnArticles];
        for (const art of data.articles) {
          if (selectedArticles.length >= 6) break;
          if (!selectedArticles.some(a => a.url === art.url)) {
            selectedArticles.push(art);
          }
        }
        
        const headlines = selectedArticles.map((art, idx) => {
          return `${idx + 1}. [${art.source.name}] ${art.title} - ${art.description || ''}`;
        }).join('\n');
        
        cachedNews = `LATEST INDIA & TAMIL NADU NEWS:\n${headlines}\n\n`;
        lastNewsFetchTime = now;
        return cachedNews;
      }
    }
  } catch (e) {
    console.error("Failed to fetch live news:", e);
  }
  return "";
}

function detectTrigger(text) {
  const t = text.toLowerCase();
  const crushWords = ['crush','girlfriend','wife','partner','future partner','actress','favourite actress','favorite actress','love interest','romantic','lover','dating','relationship'];
  
  // Exclude calendar date/time questions from triggering the romantic crush shield
  const isCalendarQuery = t.includes('date') && (t.includes('today') || t.includes('now') || t.includes('current') || t.includes('what') || t.includes('which') || t.includes('time') || t.includes('day') || t.includes('month') || t.includes('year'));
  
  const hasCrushWord = crushWords.some(k => t.includes(k)) || (/\bdate\b/i.test(t) && !isCalendarQuery) || /\bgf\b/i.test(t);
  if (hasCrushWord) return 'CRUSH';
  
  const bfWords = ['best friend','bestfriend','bff','best buddy','closest friend','bestie'];
  if (bfWords.some(k => t.includes(k))) return 'BESTFRIEND';
  return null;
}

function formatMarkdown(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

// Clean HTML to bypass inject issues
function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function scrollBottom() {
  const m = document.getElementById('messages');
  if (m) {

}

// ============================================================
// EGG ANIMATION — BREAKING ON IMPACT
// ============================================================
function launchEggs() {
  const overlay = document.getElementById('egg-overlay');
  overlay.style.display = 'block';
  overlay.innerHTML = '';

  // Prevent multiple overlapping NOPE tags
  const existingNope = document.getElementById('nope-msg');
  if (existingNope) existingNope.remove();

  // NOPE message banner
  const nope = document.createElement('div');
  nope.id = 'nope-msg';
  nope.innerHTML = '🚫 NONE OF YOUR BUSINESS! 🚫';
  document.body.appendChild(nope);

  let eggCount = 0;
  const MAX_EGGS = 18;
  const activeFrames = [];

  function spawnEgg() {
    if (eggCount >= MAX_EGGS) return;
    eggCount++;

    // Random start position: top, left, or right
    const side = Math.floor(Math.random() * 3);
    let startX, startY, velX, velY;
    const speed = 6 + Math.random() * 5;

    if (side === 0) {
      startX = Math.random() * window.innerWidth;
      startY = -50;
      velX = (Math.random() - 0.5) * 4;
      velY = speed;
    } else if (side === 1) {
      startX = -50;
      startY = Math.random() * window.innerHeight * 0.7;
      velX = speed;
      velY = 2 + Math.random() * 3;
    } else {
      startX = window.innerWidth + 50;
      startY = Math.random() * window.innerHeight * 0.7;
      velX = -speed;
      velY = 2 + Math.random() * 3;
    }

    const egg = document.createElement('div');
    egg.className = 'egg-el';
    egg.textContent = '🥚';
    egg.style.left = startX + 'px';
    egg.style.top = startY + 'px';
    egg.style.fontSize = (28 + Math.random() * 20) + 'px';
    overlay.appendChild(egg);

    let x = startX, y = startY;
    let rotation = 0;
    const rotSpeed = (Math.random() - 0.5) * 8;
    let animId;

    function animateEgg() {
      x += velX;
      y += velY;
      velY += 0.3; // Gravity pull
      rotation += rotSpeed;

      if (egg.parentNode) {
        egg.style.left = x + 'px';
        egg.style.top = y + 'px';
        egg.style.transform = `rotate(${rotation}deg)`;
      }

      // Splat triggers
      const hitFloor = y > window.innerHeight - 60;
      const hitLeft = x < 10;
      const hitRight = x > window.innerWidth - 60;
      const hitTop = y < 10 && side !== 0;

      if (hitFloor || hitLeft || hitRight || hitTop) {
        if (egg.parentNode) {
          egg.remove();
          createSplat(x, y, hitFloor);
        }
        return;
      }
      animId = requestAnimationFrame(animateEgg);
      activeFrames.push(animId);
    }
    animId = requestAnimationFrame(animateEgg);
    activeFrames.push(animId);

    setTimeout(spawnEgg, 180 + Math.random() * 220);
  }

  spawnEgg();

  // Garbage collect all frames and DOM overlays
  setTimeout(() => {
    activeFrames.forEach(id => cancelAnimationFrame(id));
    overlay.style.display = 'none';
    overlay.innerHTML = '';
    const n = document.getElementById('nope-msg');
    if (n) n.remove();
  }, 5200);
}

function createSplat(x, y, isFloor) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', '80');
  svg.setAttribute('height', '60');
  svg.style.cssText = `
    position: fixed;
    left: ${Math.max(0, x - 35)}px;
    top: ${Math.max(0, y - 25)}px;
    z-index: 99999;
    pointer-events: none;
    animation: splatAnim 0.8s ease both;
    transform-origin: center;
  `;

  // Egg shell vectors
  const shell1 = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
  shell1.setAttribute('cx','20'); shell1.setAttribute('cy','20');
  shell1.setAttribute('rx','12'); shell1.setAttribute('ry','8');
  shell1.setAttribute('fill','#eee'); shell1.setAttribute('opacity','0.9');
  shell1.setAttribute('transform','rotate(-20,20,20)');

  const shell2 = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
  shell2.setAttribute('cx','55'); shell2.setAttribute('cy','18');
  shell2.setAttribute('rx','10'); shell2.setAttribute('ry','7');
  shell2.setAttribute('fill','#ddd'); shell2.setAttribute('opacity','0.9');
  shell2.setAttribute('transform','rotate(15,55,18)');

  // Albumen (egg white)
  const white = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
  white.setAttribute('cx','38'); white.setAttribute('cy','35');
  white.setAttribute('rx','32'); white.setAttribute('ry','16');
  white.setAttribute('fill','rgba(255,255,240,0.92)');

  // Yolk
  const yolk = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  yolk.setAttribute('cx','38'); yolk.setAttribute('cy','33');
  yolk.setAttribute('r','10'); yolk.setAttribute('fill','#f5a623');
  yolk.setAttribute('opacity','0.95');

  // Reflection
  const highlight = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  highlight.setAttribute('cx','34'); highlight.setAttribute('cy','29');
  highlight.setAttribute('r','3'); highlight.setAttribute('fill','rgba(255,255,255,0.5)');

  svg.appendChild(white);
  svg.appendChild(yolk);
  svg.appendChild(highlight);
  svg.appendChild(shell1);
  svg.appendChild(shell2);

  document.getElementById('egg-overlay').appendChild(svg);
  svg.addEventListener('animationend', () => svg.remove());
}

function adjustViewport() {
  const vv = window.visualViewport;
  if (!vv) return;

  const app = document.getElementById('app');
  if (!app) return;

  if (window.innerWidth < 600) {
    // Dynamically size app container height to match visual height minus keyboard
    app.style.height = `${vv.height}px`;
    // Place container at offset top to prevent iOS text input displacement
    app.style.top = `${vv.offsetTop}px`;
    
    // Force browser window window viewport scroll position to origin
    window.scrollTo(0, 0);
  } else {
    // Reset styling for standard desktop dimensions
    app.style.height = '';
    app.style.top = '';
  }
  
  setTimeout(scrollBottom, 50);
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', adjustViewport);
  window.visualViewport.addEventListener('scroll', adjustViewport);
}

// ============================================================
// EFFICIENT PARTICLES CANVAS BACKGROUND
// ============================================================
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let lastWidth = 0;
let lastHeight = 0;
let particles = [];

function resizeCanvas() {
  const currentWidth = window.innerWidth;
  const currentHeight = window.innerHeight;

  // Prevent redrawing/flickering for micro-height updates (keyboard toggling)
  if (Math.abs(currentWidth - lastWidth) > 10 || Math.abs(currentHeight - lastHeight) > 120) {
    canvas.width = currentWidth;
    canvas.height = currentHeight;
    lastWidth = currentWidth;
    lastHeight = currentHeight;
    initParticles();
  }
}

function initParticles() {
  // Mobile gets 22 particles to conserve CPU, desktop gets 55
  const maxParticles = window.innerWidth < 600 ? 22 : 55;
  const colors = [
    'rgba(255, 107, 0,',   // Orange
    'rgba(16, 185, 129,',  // Green
    'rgba(0, 240, 255,'    // Blue
  ];
  particles = Array.from({ length: maxParticles }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3,
    r: Math.random() * 1.3 + 0.4,
    c: colors[Math.floor(Math.random() * colors.length)]
  }));
}

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.c + '0.55)';
    ctx.fill();

    // Draw networking connection threads between particles
    particles.forEach(p2 => {
      const d = Math.hypot(p.x - p2.x, p.y - p2.y);
      if (d < 85) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = p.c + (0.06 * (1 - d / 85)) + ')';
        ctx.lineWidth = 0.45;
        ctx.stroke();
      }
    });
  });
  
  requestAnimationFrame(drawParticles);
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
drawParticles();
